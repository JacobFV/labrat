; Tappet body firmware (ESP32-S3 + PCA9685) - see README.md
;
;   pio run -e esp32s3                 build
;   pio run -e esp32s3 -t upload       flash (DevKitC-1 "UART" port)
;   pio device monitor -e esp32s3      serial console @115200 (JSON lines)
;   pio test -e native                 host-side unit tests (Unity)

[platformio]
default_envs = esp32s3

[common]
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -I include
  -Wall
  -Wextra
  -Wno-unused-parameter

[env:esp32s3]
; pioarduino platform: Arduino-ESP32 3.3.x on ESP-IDF 5.5 (ships the USB Host
; Library, usb/usb_host.h + libusb.a, in its precompiled framework libs).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_flags =
  ${common.build_flags}
  ; Native USB OTG peripheral (GPIO19/20) is used as USB *host* for the Android
  ; head (AOA). Keep TinyUSB/USB-CDC off so Serial = UART0 on the DevKit's
  ; USB-UART bridge port.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DTAPPET_ESP32=1
  -DCORE_DEBUG_LEVEL=1
build_unflags =
  -DARDUINO_USB_MODE
  -DARDUINO_USB_CDC_ON_BOOT

[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
lib_compat_mode = off
build_flags =
  ${common.build_flags}
  -std=gnu++17
  -DTAPPET_NATIVE=1
  -DUNITY_INCLUDE_DOUBLE
  -DUNITY_DOUBLE_PRECISION=1e-12
  -DTAPPET_CONFIG_DIR=\"$PROJECT_DIR/../config\"
