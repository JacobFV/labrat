[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tappet"
version = "0.1.0"
description = "Host tooling for the Tappet desktop robot: kinematics, body client, firmware simulator, web bridge, calibration and tap test"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "numpy>=1.23"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7.0"]

[project.scripts]
tappet = "tappet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tappet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
