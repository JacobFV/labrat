<text x="492.0" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Servo rail (5.1 V)</text>
<rect x="621.3" y="578.0" width="16.0" height="16.0" rx="0" stroke="#eb6834" fill="#eb6834" stroke-width="0"/>
<text x="643.3" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">ESP32-S3 + PCA9685</text>
<rect x="805.9" y="578.0" width="16.0" height="16.0" rx="0" stroke="#1baf7a" fill="#1baf7a" stroke-width="0"/>
<text x="827.9" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Head phone charging</text>
<rect x="978.1" y="578.0" width="16.0" height="16.0" rx="0" stroke="#eda100" fill="#eda100" stroke-width="0"/>
<text x="1000.1" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Conversion + protection loss</text>
<text x="30.0" y="630.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1f4e9c" font-weight="bold">Per-load assumptions (5 V rail currents):</text>
<text x="30.0" y="652.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">SG90 (yaw x2)</text>
<text x="330.0" y="652.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">idle 10 mA | moving 150-250 (200 avg) | accel. 350 | stall 650+ mA</text>
<text x="30.0" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">MG90S (shoulder, elbow x4, neck x2)</text>
<text x="330.0" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">hold 70 mA | moving 250 avg | accel. 400 | stall 750+ mA</text>
<text x="30.0" y="686.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">ESP32-S3 DevKit (Wi-Fi off; USB host)</text>
<text x="330.0" y="686.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">100 mA idle | 200 mA typ | 350 mA peak (LDO -&gt; same current at 5 V)</text>
<text x="30.0" y="703.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">PCA9685</text>
<text x="330.0" y="703.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">10 mA logic (3V3)</text>
<text x="30.0" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">Head phone (Rp 22k = 1.5 A advert.)</text>
<text x="330.0" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">1.5 A, TPS2553 limit 1.7 A typ</text>
<text x="30.0" y="737.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">Efficiency</text>
<text x="330.0" y="737.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">Buck A 85% (async), Buck B 92% (sync), PTC/Schottky/LDO ~0.2-0.4 W</text>
<text x="1000.0" y="630.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1f4e9c" font-weight="bold">Rule:</text>
<text x="1000.0" y="652.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">Firmware motion planner allows at most 3 servos moving at once.</text>
<text x="1000.0" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">Above ~18 W the 20 W charger is out of headroom: firmware</text>
<text x="1000.0" y="686.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">governor drops phone VBUS (EN low) while VIN_SENSE &lt; 8.3 V</text>
<text x="1000.0" y="703.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111">or V_SERVO &lt; 4.6 V, and restores it 2 s after recovery.</text>
