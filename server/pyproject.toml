[project]
name = "labrat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pymongo",
  "anthropic",
  "python-dotenv",
  "numpy",
  "python-multipart",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labrat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
