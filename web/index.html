<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabRat Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span><h1>LabRat</h1><span class="sub mono">desk-lab agent</span></div>
  <div id="pills" class="pills"></div>
  <div class="topright">
    <span id="conn" class="conn mono">offline</span>
    <button id="abortBtn" class="btn danger" title="Abort all motion">Abort</button>
    <img id="camThumb" class="cam-thumb" alt="phone camera" title="latest phone camera frame">
  </div>
</header>

<main class="layout">
  <section class="pane chat-pane">
    <div class="pane-head"><h2>Agent</h2><span id="agentStatus" class="status mono">idle</span></div>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="chat-form">
      <textarea id="chatInput" rows="2" placeholder="Ask LabRat... e.g. make the most orange-looking well using red &amp; yellow"></textarea>
      <button class="btn accent" type="submit">Send</button>
    </form>
  </section>

  <section class="pane twin-pane">
    <div class="pane-head">
      <h2>Digital twin</h2>
      <span id="twinMode" class="status mono">live</span>
      <div class="spacer"></div>
      <button id="liveBtn" class="btn ghost">Live</button>
    </div>
    <div id="twin" class="twin"></div>
    <div class="scrubber">
      <button id="playBtn" class="btn ghost mono">▶</button>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1">
      <span id="scrubLabel" class="mono">t=0.0s</span>
      <select id="speedSel" class="mono"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option></select>
    </div>
    <div id="twinInfo" class="twin-info mono"></div>
  </section>

  <section class="pane gallery-pane">
    <div class="pane-head tabs">
      <button class="tab on" data-tab="exp">Experiments</button><button class="tab" data-tab="learn">Learning</button><button class="tab" data-tab="mem">Memory</button>
      <div class="spacer"></div><button id="refreshBtn" class="btn ghost">↻</button></div>
    <div class="tabpane" data-pane="exp">
      <div id="expList" class="exp-list"></div>
      <div id="expDetail" class="exp-detail"></div>
    </div>
    <div class="tabpane hidden" data-pane="learn"><div id="learnBox" class="exp-detail"></div></div>
    <div class="tabpane hidden" data-pane="mem">
      <form id="memForm" class="mem-form"><input id="memQ" placeholder="search memory… e.g. orange, tip reuse"><button class="btn">Search</button></form>
      <div id="memBox" class="exp-detail"></div>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
