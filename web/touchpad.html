<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tappet Touchpad</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Touchpad">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="touchpad.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: #000; color: #e5e7eb;
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .hud {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 50%); transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; opacity: .9;
  }
  .count { font: 700 64px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #374151; }
  .conn { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: #9ca3af; }
  .conn i { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; display: inline-block; }
  .conn.ok i { background: #22c55e; } .conn.bad i { background: #ef4444; } .conn.bad { color: #f87171; }
  .size { margin-top: 4px; font: 12px ui-monospace, Menlo, monospace; color: #4b5563; }
  .hint {
    position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: #1f2937; color: #f3f4f6; border-radius: 14px; padding: 12px 44px 12px 14px; font-size: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  .hint b { color: #fff; }
  .hint button {
    position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; border: 0; border-radius: 10px;
    background: transparent; color: #9ca3af; font-size: 22px; line-height: 1; cursor: pointer;
  }
  .hint[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="count" id="count">0</div>
  <div class="conn" id="conn"><i></i><span>ready — touch anywhere</span></div>
  <div class="size" id="size"></div>
</div>
<div class="hint" id="hint" hidden>
  Tappet touchpad. For best accuracy, <b>Add to Home Screen</b> and open it from there (standalone full-screen). Keep the screen awake and don't rotate.
  <button type="button" id="hint-close" aria-label="Dismiss">×</button>
</div>
<script src="touchpad.js"></script>
</body>
</html>
