; LabRat servo hub: ESP32 + PCA9685, JSON lines over USB serial and BLE (docs/protocol.md section 4).
;
;   pio run -e esp32s3                    build for the ESP32-S3-DevKitC-1
;   pio run -e esp32s3 -t upload          flash it (either USB port)
;   pio run -e esp32                      build for a classic ESP32 DevKitC (WROOM-32)
;   pio device monitor -b 115200          talk to it (type {"id":1,"cmd":"hello"})
;   pio test -e native                    host-side unit tests (Unity)

[platformio]
default_envs = esp32s3

[common]
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter

[esp]
; Arduino-ESP32 2.0.17 (stable PlatformIO platform). The BLE code also compiles on 3.x.
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
board_build.partitions = huge_app.csv

[env:esp32s3]
extends = esp
board = esp32-s3-devkitc-1
upload_speed = 921600
; Serial = UART0 on the "UART" (USB-UART bridge) connector, USBSerial = the native "USB" connector.
; The hub serves the protocol on both, so either cable works (laptop or Android USB-OTG).
build_flags =
  ${common.build_flags}
  -DHUB_BOARD_ESP32S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags =
  -DARDUINO_USB_MODE
  -DARDUINO_USB_CDC_ON_BOOT

[env:esp32]
extends = esp
board = esp32dev
upload_speed = 921600
build_flags =
  ${common.build_flags}
  -DHUB_BOARD_ESP32=1

[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_deps}
lib_compat_mode = off
build_flags =
  ${common.build_flags}
  -std=gnu++17
  -DHUB_NATIVE=1
