name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python tests (kinematics, simulator, bridge, calibration)
        working-directory: host
        run: uv run --extra dev pytest -q
      - name: Web UI syntax check
        run: for f in web/*.js; do node --check "$f"; done

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Native unit tests
        working-directory: firmware
        run: pio test -e native
      - name: Build ESP32-S3 firmware
        working-directory: firmware
        run: pio run -e esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/esp32s3/firmware.bin

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build + unit tests
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tappet-head-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build CAD + kinematic/interference checks
        working-directory: hardware/cad
        run: uv run --python 3.12 --with build123d --with trimesh --with matplotlib --with numpy python build.py
