name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: cloud (Worker typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest + @cloudflare/vitest-plugin, D1 migrations applied in setup)
        run: npm test

  bridge:
    name: bridge (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: bridge/uv.lock
      - name: USB bridge tests (mock drivers, limits, watchdog)
        working-directory: bridge
        run: uv run --locked --group dev pytest -q

  cli:
    name: cli (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/cli/uv.lock
      - name: CLI tests
        working-directory: apps/cli
        run: uv run --locked --group dev pytest -q

  phone:
    name: phone (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check
        run: npm run check
      - name: Unit tests (hub protocol, voice)
        run: npm test

  console:
    name: console (JS syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --check every console module (parsed as ES modules)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "$f"
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done < <(find apps/console -name '*.js' -not -path '*/node_modules/*' -print0 | sort -z)
          exit $status

  firmware:
    name: firmware (servo-hub, PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/servo-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/servo-hub/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio==6.2.0
      - name: Native unit tests (Unity)
        run: pio test -e native
      - name: Build ESP32-S3 + ESP32 firmware
        run: pio run -e esp32s3 -e esp32
      - uses: actions/upload-artifact@v4
        with:
          name: servo-hub-firmware
          path: |
            firmware/servo-hub/.pio/build/esp32s3/firmware.bin
            firmware/servo-hub/.pio/build/esp32/firmware.bin

  electronics:
    name: electronics (generated files up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate pin map / BOM / power budget / wiring (cross-checks firmware pins)
        working-directory: hardware/electronics
        run: python3 gen_wiring.py
      - name: Fail if generated files differ from the committed ones
        run: |
          git status --porcelain -- hardware/electronics
          git diff --exit-code -- hardware/electronics
          test -z "$(git status --porcelain -- hardware/electronics)"
