name: syringe CAD verification
on:
  push:
    branches: [syringe-rack-integration]
    paths:
      - '.github/workflows/syringe-cad.yml'
      - 'cad/**'
      - 'bridge/**'
      - 'server/**'
      - 'web/**'
      - 'tappet/firmware/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package tracked sources for reproducible integration
        run: |
          mkdir -p /tmp/syringe-artifact/wheels
          git archive --format=zip HEAD -o /tmp/syringe-artifact/labrat-source.zip
          python -m pip download --no-deps -d /tmp/syringe-artifact/wheels build123d ocpsvg svgpathtools trianglesolver lib3mf pyserial
      - uses: actions/upload-artifact@v4
        with:
          name: syringe-integration-source
          path: /tmp/syringe-artifact
          retention-days: 7
          if-no-files-found: error
