name: syringe CAD verification
on:
  push:
    branches: [syringe-rack-integration]
    paths: ['.github/workflows/syringe-cad.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          mkdir -p /tmp/cad-deps/wheels
          git archive --format=zip --output=/tmp/cad-deps/labrat-source.zip HEAD
          git rev-parse HEAD > /tmp/cad-deps/source-commit.txt
          python -m pip download --no-deps -d /tmp/cad-deps/wheels svgpathtools svgelements geomdl trianglesolver lib3mf 'webcolors==24.8.0' 'cadquery_ocp_proxy>=7.9,<8' pyserial serial_asyncio pytest-asyncio || true
          python -m pip download --no-deps -d /tmp/cad-deps/wheels svgpathtools svgelements geomdl trianglesolver lib3mf 'webcolors==24.8.0' 'cadquery_ocp_proxy>=7.9,<8' pyserial pytest-asyncio
      - uses: actions/upload-artifact@v4
        with:
          name: syringe-source-and-dependencies
          path: /tmp/cad-deps
          retention-days: 7
