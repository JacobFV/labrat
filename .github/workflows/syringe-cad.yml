name: syringe CAD verification
on:
  push:
    branches: [syringe-rack-integration]
    paths: ['.github/workflows/syringe-cad.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          mkdir -p /tmp/cad-deps
          python -m pip download --no-deps -d /tmp/cad-deps ocp_gordon==0.1.17 svgelements geomdl
      - uses: actions/upload-artifact@v4
        with:
          name: syringe-cad-interpolation-deps
          path: /tmp/cad-deps
          retention-days: 7
