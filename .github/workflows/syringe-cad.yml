name: syringe CAD verification
on:
  push:
    branches: [syringe-rack-integration]
    paths: ['.github/workflows/syringe-cad.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-test-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p /tmp/native-deps
          curl -fL https://codeload.github.com/bblanchon/ArduinoJson/tar.gz/refs/tags/v7.4.2 | tar xz -C /tmp/native-deps
          curl -fL https://codeload.github.com/ThrowTheSwitch/Unity/tar.gz/refs/tags/v2.6.1 | tar xz -C /tmp/native-deps
      - uses: actions/upload-artifact@v4
        with:
          name: syringe-native-test-headers
          path: /tmp/native-deps
          retention-days: 7
