[project]
name = "labrat-bridge"
version = "0.1.0"
description = "LabRat laptop hardware bridge (SO-101, Tappet ESP32, GRBL CNC, servo pipette)"
requires-python = ">=3.12"
dependencies = ["websockets>=13", "pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labrat_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
