<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabRat Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span><h1>LabRat</h1></div>
  <div id="pills" class="pills"></div>
  <div class="topright">
    <span id="conn" class="conn mono">offline</span>
    <button id="abortBtn" class="btn danger" title="Stop every motor now">Abort</button>
    <img id="camThumb" class="cam-thumb" alt="phone camera" title="Latest phone photo (click to enlarge)">
  </div>
</header>

<main class="layout">
  <!-- left: the list of experiments -->
  <aside class="pane list-pane">
    <div class="pane-head"><h2>Experiments</h2></div>
    <div class="list-new"><button id="newBtn" class="btn accent wide">+ New experiment</button></div>
    <div id="expList" class="exp-list"></div>
    <div class="list-foot"><a id="allCsv" class="link" download>Download all results (CSV)</a></div>
  </aside>

  <!-- centre: the experiment page, plus notebook / model / deck -->
  <section class="pane page-pane">
    <nav class="pane-head tabs">
      <button class="tab on" data-tab="exp">Experiment</button>
      <button class="tab" data-tab="notebook">Notebook</button>
      <button class="tab" data-tab="model">Colour model</button>
      <button class="tab" data-tab="deck">Deck</button>
    </nav>
    <div class="tabpane" data-pane="exp"><div id="page" class="page"></div></div>
    <div class="tabpane hidden" data-pane="notebook"><div id="notebook" class="page"></div></div>
    <div class="tabpane hidden" data-pane="model"><div id="modelBox" class="page"></div></div>
    <div class="tabpane hidden" data-pane="deck"><div id="deckBox" class="page deck-cal"></div></div>
  </section>

  <!-- right: digital twin + agent -->
  <aside class="pane side-pane">
    <div class="twin-wrap">
      <div class="pane-head">
        <h2>Digital twin</h2>
        <span id="twinMode" class="status mono">live</span>
        <div class="spacer"></div>
        <button id="liveBtn" class="btn ghost sm" title="Show the real robot again">Live</button>
      </div>
      <div id="twin" class="twin"></div>
      <div id="twinInfo" class="twin-info mono"></div>
      <div class="scrubber">
        <button id="playBtn" class="btn ghost sm mono" title="Play / pause the replay">▶</button>
        <input id="scrub" type="range" min="0" max="0" value="0" step="1">
        <span id="scrubLabel" class="mono"></span>
        <select id="speedSel" class="mono" title="Replay speed"><option value="1">1×</option><option value="4">4×</option><option value="16" selected>16×</option><option value="64">64×</option></select>
      </div>
    </div>
    <div class="chat-wrap">
      <div class="pane-head"><h2>Agent</h2><span id="agentStatus" class="status mono">idle</span></div>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="chat-form">
        <textarea id="chatInput" rows="2" placeholder="Ask LabRat, e.g. find the most orange mix of red and yellow"></textarea>
        <button class="btn accent" type="submit">Send</button>
      </form>
    </div>
  </aside>
</main>
<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>
<script type="module" src="deck.js"></script>
<script type="module" src="camera_cal.js"></script>
</body>
</html>
