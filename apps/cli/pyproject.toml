[project]
name = "labrat-cli"
version = "0.1.0"
description = "Terminal interface for the LabRat server"
requires-python = ">=3.11"
dependencies = ["websockets>=12", "httpx", "rich", "prompt_toolkit>=3"]

[project.scripts]
labrat = "labrat_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labrat_cli"]

[dependency-groups]
dev = ["pytest>=8"]
