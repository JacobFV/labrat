<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>LabRat Eye</title>
<link rel="stylesheet" href="/phone/phone.css">
</head>
<body>
<canvas id="eyes"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud">
  <span id="conn">offline</span>
  <span id="mode"></span>
</div>
<div id="transcript"></div>
<div id="hint">🔇 If you can't hear me, flip the ring/silent switch off and turn volume up</div>
<div id="dbg"></div>
<div id="controls" class="hidden">
  <button id="flipBtn" title="switch camera">⟲ cam</button>
  <button id="talkBtn">hold to talk</button>
  <button id="vadBtn" title="auto voice detection">auto: off</button>
  <button id="previewBtn" title="show camera preview">👁</button>
</div>
<div id="start">
  <div class="title">LabRat</div>
  <div class="sub">tap to wake · enables camera, mic &amp; voice</div>
  <button id="startBtn">Start</button>
  <div id="err"></div>
</div>
<script type="module" src="/phone/phone.js"></script>
</body>
</html>
